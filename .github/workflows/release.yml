# Publica uma versão a cada tag v*: compila o codeturbo para cada plataforma,
# anexa os pacotes ao rascunho da versão e só então a publica, para que o
# aviso de atualização nunca aponte para uma versão sem executáveis.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "CodeTurbo $GITHUB_REF_NAME" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p coturbo-cli --target ${{ matrix.target }}
      - name: Empacotar e anexar
        shell: bash
        run: |
          bin=codeturbo
          [ "$RUNNER_OS" = Windows ] && bin=codeturbo.exe
          cp "target/${{ matrix.target }}/release/$bin" .
          archive="codeturbo-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" "$bin" LICENSE-MIT LICENSE-APACHE README.md
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
