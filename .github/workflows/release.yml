# Publishes a release for each v* tag: builds codeturbo for every platform,
# attaches the packages to the draft release and only then publishes it, so
# the update notice never points at a release without binaries.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "CodeTurbo $GITHUB_REF_NAME" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-linux-android, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *android ]]; then
            # Termux: built with the Android NDK the runner already has.
            # Android only starts position-independent executables.
            tc="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android24-clang"
            export CC_aarch64_linux_android="$tc/aarch64-linux-android24-clang"
            export AR_aarch64_linux_android="$tc/llvm-ar"
          fi
          cargo build --release --locked -p coturbo-cli --target ${{ matrix.target }}
      - name: Check the Linux and Android binaries
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/codeturbo"
          readelf -h "$bin" | grep -E 'Type:'
          if [[ "${{ matrix.target }}" == *android ]]; then
            readelf -h "$bin" | grep -q 'DYN' || { echo "not a PIE binary: Android cannot run it"; exit 1; }
          else
            "$bin" --version
          fi
      - name: Package and upload
        shell: bash
        run: |
          bin=codeturbo
          [ "$RUNNER_OS" = Windows ] && bin=codeturbo.exe
          cp "target/${{ matrix.target }}/release/$bin" .
          archive="codeturbo-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" "$bin" LICENSE-MIT LICENSE-APACHE README.md
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
