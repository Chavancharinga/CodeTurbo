[package]
name = "coturbo-net"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
futures-util.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
# TVs: Samsung and LG speak WebSocket over TLS with self-signed certificates.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Google Cast: TLS straight over TCP.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Android TV over ADB: RSA key pairing.
rsa = { version = "0.9", features = ["sha1"] }
sha1 = { version = "0.10", features = ["oid"] }
rand = "0.8"
