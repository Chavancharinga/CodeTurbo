# USD per million tokens. cache_write = 5-minute TTL write price.
# Anthropic first-party prices as of 2026-10. Add other models (OpenAI,
# OpenRouter ids, ...) in ~/.config/codeturbo/pricing.toml; unknown models
# show token counts without a dollar figure.

[models."claude-opus-5-5"]
input = 4.0
cache_write = 5.0
cache_read = 0.20
output = 20.0

[models."claude-sonnet-5-5"]
input = 2.0
cache_write = 2.5
cache_read = 0.20
output = 10.0

[models."claude-haiku-5-5"]
input = 0.10
cache_write = 0.125
cache_read = 0.01
output = 0.50

[models."claude-fable-5-1"]
input = 10.0
cache_write = 12.5
cache_read = 0.25
output = 50.0

# Local models cost nothing.
[models."ollama"]
input = 0.0
cache_write = 0.0
cache_read = 0.0
output = 0.0
