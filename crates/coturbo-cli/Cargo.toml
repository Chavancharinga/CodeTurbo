[package]
name = "coturbo-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "codeturbo"
path = "src/main.rs"

[dependencies]
coturbo-agent = { path = "../coturbo-agent" }
coturbo-browse = { path = "../coturbo-browse" }
coturbo-providers = { path = "../coturbo-providers" }
coturbo-tools = { path = "../coturbo-tools" }
coturbo-verify = { path = "../coturbo-verify" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
tempfile = "3"
terminal_size = "0.4"
reqwest.workspace = true
flate2 = "1"
tar = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
toml_edit = "0.25.17"
unicode-width = "0.2.2"
png = "0.18.1"

[dev-dependencies]
coturbo-design = { path = "../coturbo-design" }
gif = "0.13"
